name: Gradle Package & Release Publisher

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      publish_maven_if_configured:
        description: 'Run Gradle publish task if maven-publish is configured'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish Gradle Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradlew & Signing Keystore
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Release,O=SectIdle,C=ID"
          fi

      - name: Build & Verify with Gradle
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon

      - name: Publish to GitHub Packages (If Maven Publishing Configured)
        if: github.event.inputs.publish_maven_if_configured != 'false'
        run: |
          if ./gradlew tasks --group="publishing" --no-daemon | grep -qE "^publish( |$)"; then
            ./gradlew publish --no-daemon
          else
            echo "[i] No maven-publish 'publish' task configured in build.gradle.kts — skipping Maven publish cleanly."
          fi
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Built Release Packages
        run: |
          mkdir -p export/gradle-publish
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} export/gradle-publish/ \;
          (cd export/gradle-publish && sha256sum * > SHA256SUMS.txt)

      - name: Upload Gradle Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradle-published-packages
          path: export/gradle-publish/*
          retention-days: 30

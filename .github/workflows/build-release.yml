name: Build & Publish Release Mobile, Web, Desktop & Console Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Multiplatform Release Artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Chimera Stack Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build All Console, Mobile, Web, Desktop & iOS Artifacts
        run: |
          node build_v6.js --all

      - name: Create Debug Keystore for Release Fallback
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Mobile Android Release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache

      - name: Copy Release APK to Export
        run: |
          cp app/build/outputs/apk/release/app-release.apk export/NUSA_MOBILE.apk || true

      - name: Upload Build Artifacts (Mobile, Web, Desktop, Consoles)
        uses: actions/upload-artifact@v4
        with:
          name: nusa-legends-multiplatform-builds
          path: |
            export/*.apk
            export/*.ipa
            export/*.zip
            export/*.ISO
            export/*.NDS
            export/*.VPK
            export/*.NSP
            export/*.PKG
            export/*.BIN
            export/*.exe
            export/*.dmg
            export/*.AppImage
            export/*.so

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            export/NUSA_MOBILE.apk
            export/NUSA_IOS_PACKAGE.ipa
            export/NUSA_WEB_GAME.zip
            export/NUSA_WINDOWS.exe
            export/NUSA_MAC.dmg
            export/NUSA_LINUX.AppImage
            export/NUSA_PSX.BIN
            export/NUSA_PS2.ISO
            export/NUSA_NDS.NDS
            export/NUSA_PSP.ISO
            export/NUSA_VITA.VPK
            export/NUSA_SWITCH.NSP
            export/NUSA_PS3.PKG
            export/NUSA_RETROARCH.so
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

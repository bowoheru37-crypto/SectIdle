name: Android & Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Run Android Lint check'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradlew & Debug Keystore
        shell: bash
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=SectIdle,C=ID"
          fi

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Run Android Lint
        if: github.event.inputs.run_lint != 'false'
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-${{ matrix.os }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  dependency-submission:
    name: Submit Gradle Dependency Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4
